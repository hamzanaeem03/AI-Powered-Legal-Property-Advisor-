name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx next lint

      - name: Type check
        run: npm run typecheck

      # Downloaded MongoDB binaries for mongodb-memory-server
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders: the build must not depend on real secrets
          JWT_SECRET: ci-placeholder-secret-0123456789abcdef0123456789
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
